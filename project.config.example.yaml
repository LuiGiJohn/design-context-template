# project.config.example.yaml — a fully worked example.
# Copy the SHAPE, not the values. Every value below is fictional sample data.
# This one is `ds_mode: consume` because the design system was already published.

ds_mode: consume

project:
  name:             "Aster Pay"
  system_name:      "APS"
  system_full_name: "Aster Pay Interface System"
  brand_shorthand:  "AP"
  parent_org:       "Aster Financial"
  domain:           "fintech"
  github_owner:     "your-github-handle"

design_system:
  figma_source_key: "AbCdEf1234567890GhIjKl"   # sample — the 22-char key from your DS file's URL
  library_key:      "lk-0000example0000example0000example0000example0000example0000"  # sample — real ones are ~128 hex chars
  version:          "v0.9"
  published_date:   "2026-05-21"
  fonts:            "Inter (400/500/600/700) + Source Serif 4"
  token_prefixes:   ["Surface", "Text", "Border", "Icon", "Scale", "Border-Radius", "Border-Width"]

consumer:
  figma_file_key:  "MnOpQr0987654321StUvWx"     # sample — the screen write-surface file
  file_name:       "AP-Onboarding-Screens"
  frame:
    width:    402
    height:   874
    bg_token: "Surface/Page"

prototype:
  name:        "ap-app-flow"
  description: "Aster Pay returning-user login → dashboard"
  analytics:
    posthog_key_env:  "VITE_POSTHOG_KEY"
    posthog_host_env: "VITE_POSTHOG_HOST"
    clarity_env:      "VITE_CLARITY_ID"

# OPTIONAL — the code arm. Set repos.engineering_context to render the 3rd context
# (coded component library + Storybook + native app + release). Omit for design-only.
engineering:
  component_lib:  "ui"                                # shared RN component package name  → {{COMPONENT_LIB}}
  native_stack:   "Expo / React Native"              #                                   → {{NATIVE_STACK}}
  app_package_id: "com.example.asterpay"             # native app id                     → {{APP_PACKAGE_ID}}
  eas_project:    "@example/aster-pay"               # EAS project slug                  → {{EAS_PROJECT}}

repos:
  ds_context:          "aps-design-system-context"
  studio_context:      "aps-studio-context"
  engineering_context: "aster-pay-app"                # omit this line for a design-only project

user_preferences:
  methodology:   "Atomic Design, WCAG 2.2 AA, semantic HTML + ARIA by default"
  communication: "Lead-to-peer. Skip apologies, filler, hedging. Brief and direct."
  code_style:    "Clean, exemplary, JSDoc on complex logic. Show diffs for minor fixes."
  mentorship:    "Mentors junior designers; output should be documentation-worthy."
  honesty:       "Direct disclosure of constraints, gotchas, limitations. No oversell."
  format:        "yaml blocks for planning/decisions; inline prose for execution. No tappable buttons."

